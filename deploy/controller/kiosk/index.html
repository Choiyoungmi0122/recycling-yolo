<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분리수거 안내</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --text: #f4f5f7;
    --muted: #a3a8b3;
    --info: #3b82f6;
    --ok: #16a34a;
    --warn: #f59e0b;
    --error: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "Noto Sans KR", "NanumGothic", "Malgun Gothic", sans-serif; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: flex; }

  #standby { flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh; }
  #standby video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* 슬라이드: 16:9 슬라이드를 화면에 맞추고 남는 띠는 슬라이드 테두리 색으로 채움 */
  #standby .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; transition: opacity 0.8s ease; }
  #standby .slide.show { opacity: 1; }
  #standby .placeholder h1 { font-size: 7vh; font-weight: 700; text-align: center; }
  #standby .placeholder p { font-size: 3.4vh; color: var(--muted); text-align: center; margin-top: 2vh; }

  /* 카메라 화면: 영상이 화면 전체를 채우고(cover), 안내 문구는 아래에 반투명 띠로 겹쳐 표시 */
  #camera { flex-direction: column; }
  #camera .view { position: absolute; inset: 0; background: #000; }
  #camera img { width: 100%; height: 100%; object-fit: cover; }
  #camera .guide { position: absolute; left: 0; right: 0; bottom: 0; min-height: 24%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 2.5vh 5vw; background: rgba(24, 27, 34, 0.86); border-top: 1vh solid var(--info); gap: 1.4vh; }
  #camera .guide .title { font-size: 3.4vh; color: var(--muted); font-weight: 600; }
  #camera .guide .message { font-size: 5.4vh; font-weight: 700; line-height: 1.3; }

  #camera.tone-ok .guide { border-top-color: var(--ok); }
  #camera.tone-ok .title { color: var(--ok) !important; }
  #camera.tone-warn .guide { border-top-color: var(--warn); }
  #camera.tone-warn .title { color: var(--warn) !important; }
  #camera.tone-error .guide { border-top-color: var(--error); }
  #camera.tone-error .title { color: var(--error) !important; }

  #camera.tone-info .message::after { content: ""; display: inline-block; width: 4.4vh; height: 4.4vh;
    margin-left: 2vh; vertical-align: -0.6vh; border: 0.6vh solid var(--muted);
    border-top-color: var(--info); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #offline { position: absolute; right: 2vh; bottom: 2vh; padding: 1vh 2vh; border-radius: 1vh;
    background: var(--error); font-size: 2.2vh; display: none; }
</style>
</head>
<body>

<section id="standby" class="screen active">
  <div class="placeholder">
    <h1>재활용품을 올려주세요</h1>
    <p>캔 · 유리병 · 페트병 · 플라스틱</p>
  </div>
</section>

<section id="camera" class="screen tone-info">
  <div class="view"><img id="stream" alt=""></div>
  <div class="guide">
    <div class="title" id="title"></div>
    <div class="message" id="message"></div>
  </div>
</section>

<div id="offline">컨트롤러 연결 끊김</div>

<script>
const standby = document.getElementById("standby");
const camera = document.getElementById("camera");
const stream = document.getElementById("stream");
let streamUrl = null;

async function init() {
  const cfg = await fetch("/config.json").then(r => r.json());
  streamUrl = "/stream.mjpg";  // 컨트롤러가 추론 서비스 스트림을 중계

  if (cfg.standby_slides && cfg.standby_slides.length) {
    startSlides(cfg.standby_slides, cfg.standby_slide_seconds, cfg.standby_background, cfg.standby_frame);
  } else if (cfg.standby_video) {
    standby.innerHTML = "";
    const video = document.createElement("video");
    Object.assign(video, { src: cfg.standby_video, autoplay: true, muted: true, loop: true, playsInline: true });
    standby.appendChild(video);
  }

  const es = new EventSource("/ui");
  es.onopen = () => { document.getElementById("offline").style.display = "none"; };
  es.onerror = () => { document.getElementById("offline").style.display = "block"; };
  es.onmessage = e => render(JSON.parse(e.data));
}

// 대기 화면 슬라이드쇼: 이미지 전부 미리 올려두고 opacity 로 교차 전환
// frame 이 있으면 모니터 가장자리에 틀(어두운 선 + 초록 + 어두운 선)을 그리고 그 안에 슬라이드
function startSlides(urls, seconds, background, frame) {
  standby.innerHTML = "";
  standby.style.background = background || "#000";

  let holder = standby;
  if (frame) {
    const outer = document.createElement("div");
    outer.style.cssText = `position:absolute; inset:0; border:2px solid ${frame.line};`;
    const green = document.createElement("div");
    green.style.cssText = `position:absolute; inset:0; border:${frame.width}px solid ${frame.color};`;
    const panel = document.createElement("div");
    panel.style.cssText = `position:absolute; inset:0; border:2px solid ${frame.line}; background:${background};`;
    green.appendChild(panel);
    outer.appendChild(green);
    standby.appendChild(outer);
    holder = panel;
  }

  const imgs = urls.map(url => {
    const img = document.createElement("img");
    img.className = "slide";
    img.src = url;
    img.alt = "";
    holder.appendChild(img);
    return img;
  });

  let i = 0;
  imgs[0].classList.add("show");

  if (imgs.length > 1) {
    setInterval(() => {
      imgs[i].classList.remove("show");
      i = (i + 1) % imgs.length;
      imgs[i].classList.add("show");
    }, Math.max(1, seconds) * 1000);
  }
}

function render(s) {
  const toCamera = s.screen === "camera";
  standby.classList.toggle("active", !toCamera);
  camera.classList.toggle("active", toCamera);

  // 카메라 화면일 때만 스트림 연결 (대기 중에는 인코딩 부하 없음)
  if (toCamera && stream.dataset.on !== "1") {
    stream.src = streamUrl;
    stream.dataset.on = "1";
  } else if (!toCamera && stream.dataset.on === "1") {
    stream.removeAttribute("src");
    stream.dataset.on = "0";
  }

  if (toCamera) {
    camera.className = `screen active tone-${s.tone || "info"}`;
    document.getElementById("title").textContent = s.title || "";
    document.getElementById("message").textContent = s.message || "";
  }
}

init();
</script>
</body>
</html>
